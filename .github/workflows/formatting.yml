name: Code Quality Check

on:
  push:
    branches: ["main", "main-preview"]
  pull_request:
    branches: ["*"]

jobs:
  prettier-check:
    name: Run Prettier Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run Prettier to check code formatting
      - name: Run Prettier check
        run: npm run prettier:check
        # If the Prettier check fails, the job will fail

  eslint-check:
    name: Run ESLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run eslint checks
      - name: Run ESLint
        id: eslint
        run: |
          npm run lint
