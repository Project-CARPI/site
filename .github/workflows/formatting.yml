name: Code Quality Check

on: [push, pull_request]

jobs:
  prettier-check:
    name: Run Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment
        uses: ./.github/workflows/actions/setup-node.yml

      - name: Run Prettier check
        run: npm run prettier:check

  eslint-check:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment
        uses: ./.github/workflows/actions/setup-node.yml

      - name: Run ESLint
        run: npm run lint
